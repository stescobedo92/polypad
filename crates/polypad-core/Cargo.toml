[package]
name = "polypad-core"
description = "PolyPad domain logic, independent of Tauri: workspace, sessions, supervision, telemetry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` on the types that cross the Tauri IPC boundary (enabled by src-tauri).
specta = ["dep:specta"]

[dependencies]
atomic-write-file.workspace = true
blake3.workspace = true
dunce.workspace = true
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true, features = ["serde_json"] }
thiserror.workspace = true
trash.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
