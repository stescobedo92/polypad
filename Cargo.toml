[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/stescobedo92/polypad"
authors = ["Sergio Triana Escobedo"]
publish = false

[workspace.dependencies]
# Internal crates
polypad-core = { path = "crates/polypad-core" }
polypad-protocol = { path = "crates/polypad-protocol" }
polypad-kernel-host = { path = "crates/polypad-kernel-host" }
polypad-lsp-broker = { path = "crates/polypad-lsp-broker" }
polypad-db = { path = "crates/polypad-db" }
polypad-packages = { path = "crates/polypad-packages" }
polypad-secrets = { path = "crates/polypad-secrets" }

# External crates. Tauri itself is declared directly in src-tauri/Cargo.toml because the
# Tauri CLI manages its feature list there.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
# specta/tauri-specta are release candidates: pinned exactly, see docs/adr/0002.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

# Test-only
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# "No unwrap/expect/panic in production paths" enforced by the compiler instead of by review.
# clippy.toml relaxes these inside #[test] code only.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Diagnostics go through `tracing`, never straight to the process streams.
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic stays "unwind" on purpose: a panic inside a tokio task (kernel supervisor, LSP broker)
# must surface as a JoinError instead of aborting the whole app. See docs/adr/0005.
