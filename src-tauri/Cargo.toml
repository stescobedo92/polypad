[package]
name = "polypad"
description = "PolyPad desktop application (Tauri 2 shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "polypad"

[lib]
name = "polypad_app"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
polypad-core = { workspace = true, features = ["specta"] }
polypad-protocol.workspace = true
serde.workspace = true
specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
tauri = { version = "2.12.0", features = [] }
# Used from Rust only: the WebView gets no plugin permission (see docs/adr/0003).
tauri-plugin-dialog = "2.8.0"
tauri-plugin-single-instance = "2.5.1"
tauri-plugin-window-state = "2.5.0"
# Release candidate pinned exactly, together with specta (see docs/adr/0002).
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"

[dev-dependencies]
dunce.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
